
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Download_Aplikasi_Catatan_Mingguan.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip -o Download_Aplikasi_Catatan_Mingguan.zip -d .

      - name: Fix JVM target compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          s = s.replace(
              "    compileSdk 35\n",
              "    compileSdk 35\n\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = '17'\n    }\n"
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BukuCatatanMingguan-APK
          path: app/build/outputs/apk/debug/app-debug.apk
